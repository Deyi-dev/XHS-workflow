[project]
name = "xhs-to-obsidian"
version = "0.1.0"
description = "Archive Xiaohongshu notes to Obsidian vault"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "google-generativeai>=0.8",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "click>=8.1",
    "mcp>=1.6",
    "pillow>=10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.uv]
dev-dependencies = []
